<footer class="{{ .Site.Params.background_color_class | default "bg-black" }} bottom-0 w-100 pa3" role="contentinfo">
  {{ partial "sponsor-banner.html" . }}
  <div class="flex justify-between">
  <a class="f4 fw4 hover-white white-70 dn dib-ns pv2 ph3 no-underline" href="{{ .Site.Home.Permalink }}" >
    &copy; {{ with .Site.Copyright | default .Site.Title }} {{ . | safe.HTML }} {{ now.Format "2006"}} {{ end }}
  </a>
    <div>{{ partial "social/follow.html" . }}</div>
  </div>
  <div class="footer-legal">
    <a href="/impressum/">Impressum</a>
    <span aria-hidden="true">|</span>
    <a href="/datenschutz/">Datenschutzerklärung</a>
  </div>
</footer>
{{ partials.Include "footer-scripts.html" . }}
