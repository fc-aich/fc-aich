
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_PARAMS_CALENDAR_GOOGLE_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
      HUGO_PARAMS_CALENDAR_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Debug - Verify environment variables
        run: |
          echo "Checking calendar configuration..."
          if [ -z "$HUGO_PARAMS_CALENDAR_GOOGLE_API_KEY" ]; then
            echo "❌ GOOGLE_CALENDAR_API_KEY is not set"
          else
            echo "✅ GOOGLE_CALENDAR_API_KEY is set (length: ${#HUGO_PARAMS_CALENDAR_GOOGLE_API_KEY})"
          fi
          if [ -z "$HUGO_PARAMS_CALENDAR_CALENDAR_ID" ]; then
            echo "❌ GOOGLE_CALENDAR_ID is not set"
          else
            echo "✅ GOOGLE_CALENDAR_ID is set (length: ${#HUGO_PARAMS_CALENDAR_CALENDAR_ID})"
          fi

      - name: Build
        env:
          HUGO_PARAMS_CALENDAR_GOOGLE_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
          HUGO_PARAMS_CALENDAR_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: hugo --minify

      - name: Debug - Verify generated HTML
        run: |
          echo "Checking generated HTML for calendar configuration..."
          if grep -q 'data-api-key=""' public/verein/termine/index.html; then
            echo "❌ API key is empty in generated HTML"
          else
            echo "✅ API key appears to be set in HTML"
          fi
          echo "HTML snippet:"
          grep -A 2 "fc-calendar-container" public/verein/termine/index.html || echo "Container not found in HTML"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
