baseURL = "https://fc-aich.de/"
title = "FC Aich"
theme = "ananke"
languageCode = "de-de"
defaultContentLanguage = "de"
#relativeURLs = true
#canonifyURLs = true
timeZone = "Europe/Berlin"

[pagination]
  pagerSize = 9

[params]
#author = "FC Aich"
description = "Offizielle Website des FC Aich – Fussball im Landkreis Fuerstenfeldbruck"
site_logo = "/img/fc-aich-logo.svg"
favicon = "favicon.ico"
custom_css = ["custom.css"]
style = "blue"
date_format = "02.01.2006"
about_us = "Der FC Aich ist ein Fussballverein im Landkreis Fuerstenfeldbruck. Von den Bambini bis zu den Alten Herren – bei uns gibt es Fussball fuer alle."
copyright = "© {{ now.Year }} FC Aich"
email = "info@fc-aich.de"
# css
body_classes="avenir bg-near-black"
post_content_classes="avenir bg-near-black"
#read_more_copy="Mehr..."
background_color_class="bg-near-black"
text_color="near-white"


